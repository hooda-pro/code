<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>محرر VS Code | تحرير المشروع</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="editor.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>
<body class="dark-mode">
    <!-- شاشة التحميل -->
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <h3>جاري تحميل المحرر...</h3>
    </div>

    <div class="editor-app" id="editorApp" style="display: none;">
        <!-- رأس المحرر -->
        <header class="editor-header">
            <div class="header-left">
                <button class="btn btn-icon" id="backBtn" aria-label="العودة"><i class="fas fa-arrow-right"></i></button>
                <button class="btn btn-icon mobile-menu-toggle" id="mobileMenuToggle" aria-label="القائمة"><i class="fas fa-bars"></i></button>
            </div>
            <div class="header-center">
                <div class="project-badge">
                    <i class="fas fa-code"></i>
                    <h1 id="projectName">مشروع</h1>
                </div>
                <span class="project-status" id="projectStatus"><i class="fas fa-circle"></i> تم الحفظ</span>
            </div>
            <div class="header-right">
                <button class="btn btn-icon theme-toggle" id="themeToggle" aria-label="تبديل المظهر"><i class="fas fa-moon"></i></button>
                <div class="mobile-more">
                    <button class="btn btn-icon" id="mobileMoreBtn" aria-label="المزيد"><i class="fas fa-ellipsis-v"></i></button>
                    <div class="mobile-dropdown" id="mobileDropdown">
                        <button class="dropdown-item" id="mobileSave"><i class="fas fa-save"></i> حفظ</button>
                        <button class="dropdown-item" id="mobilePreview"><i class="fas fa-eye"></i> معاينة</button>
                        <button class="dropdown-item" id="mobileAddFile"><i class="fas fa-plus"></i> ملف جديد</button>
                        <button class="dropdown-item" id="mobileDownload"><i class="fas fa-download"></i> تحميل</button>
                        <button class="dropdown-item" id="mobileFormat"><i class="fas fa-indent"></i> تنسيق</button>
                        <button class="dropdown-item" id="mobileFullscreen"><i class="fas fa-expand"></i> ملء الشاشة</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- التخطيط الرئيسي -->
        <div class="editor-layout">
            <!-- الشريط الجانبي -->
            <aside class="editor-sidebar" id="editorSidebar">
                <div class="sidebar-header">
                    <h3>القائمة</h3>
                    <button class="btn btn-icon" id="closeSidebar"><i class="fas fa-times"></i></button>
                </div>
                <div class="sidebar-section">
                    <div class="section-title">
                        <i class="fas fa-folder-open"></i>
                        <span>ملفات المشروع</span>
                        <button class="btn btn-icon btn-sm" id="refreshFiles"><i class="fas fa-redo"></i></button>
                    </div>
                    <div class="files-list" id="filesList"></div>
                </div>
                <div class="sidebar-section">
                    <div class="section-title">
                        <i class="fas fa-tools"></i>
                        <span>الأدوات</span>
                    </div>
                    <div class="tools-grid">
                        <button class="tool-btn" id="formatBtn"><i class="fas fa-indent"></i> تنسيق</button>
                        <button class="tool-btn" id="clearBtn"><i class="fas fa-eraser"></i> مسح</button>
                        <button class="tool-btn" id="searchBtn"><i class="fas fa-search"></i> بحث</button>
                        <button class="tool-btn" id="fullscreenBtn"><i class="fas fa-expand"></i> ملء الشاشة</button>
                    </div>
                </div>
                <div class="sidebar-section">
                    <div class="section-title">
                        <i class="fas fa-info-circle"></i>
                        <span>معلومات</span>
                    </div>
                    <div class="project-details" id="projectDetails"></div>
                </div>
                <div class="sidebar-footer">
                    <button class="btn btn-primary btn-block" id="addFileBtn"><i class="fas fa-plus"></i> ملف جديد</button>
                    <button class="btn btn-outline btn-block" id="fileManagerBtn"><i class="fas fa-cog"></i> إدارة الملفات</button>
                    <button class="btn btn-outline btn-block" id="backToHome"><i class="fas fa-home"></i> الرئيسية</button>
                </div>
            </aside>

            <!-- منطقة التحرير -->
            <main class="editor-main">
                <div class="editor-tabs" id="editorTabs"></div>
                <div class="code-editor">
                    <div class="editor-toolbar">
                        <div class="file-info">
                            <i class="fas fa-file-code"></i>
                            <span id="currentFileName">اختر ملفاً</span>
                        </div>
                        <div class="toolbar-actions">
                            <select class="language-select" id="languageSelect">
                                <option value="html">HTML</option>
                                <option value="css">CSS</option>
                                <option value="javascript">JavaScript</option>
                                <option value="python">Python</option>
                                <option value="php">PHP</option>
                                <option value="json">JSON</option>
                                <option value="xml">XML</option>
                                <option value="markdown">Markdown</option>
                                <option value="text">نص عادي</option>
                            </select>
                            <button class="btn btn-icon" id="copyCode" title="نسخ"><i class="fas fa-copy"></i></button>
                        </div>
                    </div>
                    <div class="code-area">
                        <textarea id="codeInput" placeholder="اكتب كودك هنا..." spellcheck="false"></textarea>
                        <div class="line-numbers" id="lineNumbers"></div>
                    </div>
                    <div class="editor-statusbar">
                        <span class="sb-item"><i class="fas fa-list-ol"></i> <span id="lineCount">0</span></span>
                        <span class="sb-sep">|</span>
                        <span class="sb-item"><i class="fas fa-font"></i> <span id="charCount">0</span></span>
                        <span class="sb-sep">|</span>
                        <span class="sb-item" id="cursorPos">س1 ع1</span>
                        <span class="shortcuts">Ctrl+S حفظ</span>
                    </div>
                </div>
            </main>
        </div>

        <!-- شريط سفلي للموبايل -->
        <footer class="mobile-bottom-nav">
            <button class="bottom-nav-item" id="bottomSave"><i class="fas fa-save"></i><span>حفظ</span></button>
            <button class="bottom-nav-item" id="bottomPreview"><i class="fas fa-eye"></i><span>معاينة</span></button>
            <button class="bottom-nav-item" id="bottomAddFile"><i class="fas fa-plus"></i><span>جديد</span></button>
            <button class="bottom-nav-item" id="bottomMenu"><i class="fas fa-bars"></i><span>قائمة</span></button>
        </footer>
    </div>

    <!-- مودال إنشاء ملف جديد -->
    <div class="modal" id="newFileModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3><i class="fas fa-file-plus"></i> ملف جديد</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="newFileForm">
                    <div class="form-group">
                        <label>اسم الملف</label>
                        <input type="text" id="fileName" class="form-control" placeholder="مثال: script.js" required>
                    </div>
                    <div class="form-group">
                        <label>لغة الملف</label>
                        <select id="fileLanguage" class="form-control">
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="php">PHP</option>
                            <option value="json">JSON</option>
                            <option value="xml">XML</option>
                            <option value="markdown">Markdown</option>
                            <option value="text">نص عادي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المحتوى الابتدائي</label>
                        <textarea id="fileContent" class="form-control" rows="6"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">إلغاء</button>
                <button class="btn btn-primary" id="createFileBtn">إنشاء</button>
            </div>
        </div>
    </div>

    <!-- مودال إدارة الملفات -->
    <div class="modal modal-lg" id="fileManagerModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3><i class="fas fa-folder"></i> إدارة الملفات</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="file-manager">
                    <div class="file-manager-header">
                        <div class="search-wrapper">
                            <i class="fas fa-search"></i>
                            <input type="text" id="fileSearch" placeholder="ابحث عن ملف...">
                        </div>
                        <button class="btn btn-primary" id="addFileFromManager"><i class="fas fa-plus"></i> إضافة ملف</button>
                    </div>
                    <div class="file-list" id="fileManagerList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- مودال البحث والاستبدال -->
    <div class="modal" id="searchModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3><i class="fas fa-search"></i> بحث واستبدال</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="searchForm">
                    <div class="form-group">
                        <label>بحث عن:</label>
                        <input type="text" id="searchText" class="form-control" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>استبدال بـ:</label>
                        <input type="text" id="replaceText" class="form-control" autocomplete="off">
                    </div>
                    <div class="form-options" style="display: flex; gap: 20px; margin-bottom: 15px;">
                        <label class="checkbox" style="display: flex; align-items: center; gap: 6px;">
                            <input type="checkbox" id="matchCase"> <span>مطابقة حالة الأحرف</span>
                        </label>
                        <label class="checkbox" style="display: flex; align-items: center; gap: 6px;">
                            <input type="checkbox" id="wholeWord"> <span>كلمة كاملة</span>
                        </label>
                    </div>
                    <div class="search-results" id="searchResults" style="background: var(--surface); border-radius: 8px; padding: 10px; min-height: 60px;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <div style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%; justify-content: flex-end;">
                    <button class="btn btn-secondary" id="prevResult"><i class="fas fa-arrow-up"></i> السابق</button>
                    <button class="btn btn-secondary" id="nextResult"><i class="fas fa-arrow-down"></i> التالي</button>
                    <button class="btn btn-primary" id="searchActionBtn"><i class="fas fa-search"></i> بحث</button>
                    <button class="btn btn-success" id="replaceBtn"><i class="fas fa-exchange-alt"></i> استبدال</button>
                    <button class="btn btn-warning" id="replaceAllBtn"><i class="fas fa-sync-alt"></i> استبدال الكل</button>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تأكيد الخروج -->
    <div class="modal" id="exitModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3><i class="fas fa-sign-out-alt"></i> تأكيد الخروج</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>لديك تغييرات غير محفوظة. هل تريد الحفظ قبل الخروج؟</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="exitWithoutSave">خروج بدون حفظ</button>
                <button class="btn btn-primary" id="saveAndExit">حفظ وخروج</button>
                <button class="btn btn-secondary modal-close">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- حاوية التوست -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="editor.js"></script>
</body>
</html>
